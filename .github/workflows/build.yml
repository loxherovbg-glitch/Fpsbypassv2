name: Build LO FPS Bypass

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          curl -fsSL https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -o geode.zip
          unzip geode.zip -d /tmp/geode
          chmod +x /tmp/geode/geode
          echo "/tmp/geode" >> $GITHUB_PATH

      - name: Install Geode SDK
        run: |
          geode sdk install
          geode sdk install-binaries -p android64

      - name: Build Android
        run: geode build -p android64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lo-fpsbypass-android
          path: build-android64/*.geode
